[package]
name = "vouch"
version = "0.48.0"
edition = "2021"
rust-version = "1.96"
license = "WTFPL"

[lib]
name = "vouch"
path = "src/lib.rs"

[[bin]]
name = "vouch"
path = "src/main.rs"

[[bin]]
name = "vouch-codex-broker"
path = "src/bin/vouch-codex-broker.rs"

[dependencies]
brush-parser = "0.4.0"
ruff_python_ast = "=0.0.8"
ruff_python_parser = "=0.0.8"
rmcp = { version = "3.1.4", default-features = false, features = ["client", "server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = { version = "0.8", features = ["preserve_order"] }
toml_edit = "0.25.13"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }
oxc_allocator = "=0.150.0"
oxc_parser = "=0.150.0"
oxc_ast = "=0.150.0"
oxc_span = "=0.150.0"
oxc_ast_visit = "=0.150.0"
poshtree = "0.4.2"
