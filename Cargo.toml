[package]
name = "vouch"
version = "0.3.0"
edition = "2021"
rust-version = "1.97"
license = "WTFPL"

[lib]
name = "vouch"
path = "src/lib.rs"

[[bin]]
name = "vouch"
path = "src/main.rs"

[dependencies]
brush-parser = "0.4.0"
ruff_python_ast = "=0.0.8"
ruff_python_parser = "=0.0.8"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["preserve_order"] }
toml_edit = "0.25.13"
